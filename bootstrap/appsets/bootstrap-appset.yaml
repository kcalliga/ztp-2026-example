apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: https://github.com/kcalliga/ztp-2026-example.git
    targetRevision: main
    path: bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Helpful if you ever apply large CRDs/objects, optional:
      - ServerSideApply=true

